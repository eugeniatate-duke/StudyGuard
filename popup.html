<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyGuard settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>

  <body>
    <main>
      <h1>StudyGuard</h1>
      <p>Settings for your AI study companion.</p>

      <label>
        <!-- JavaScript enables this after loading the saved setting. -->
        <input id="study-mode" type="checkbox" disabled>
        Enable study mode
      </label>

      <p id="status" role="status">Loading settings...</p>

      <p>
        This setting is saved on this device.
        Inline study prompts are still under development.
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
