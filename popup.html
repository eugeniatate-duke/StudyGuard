<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyGuard settings</title>
    <link rel="stylesheet" href="popup.css">
  </head>

  <body>
    <main>
      <h1>StudyGuard</h1>
      <p>Settings for your AI study companion.</p>

      <label>
        <!-- JavaScript enables this after loading the saved setting. -->
        <input id="study-mode" type="checkbox" disabled>
        Enable study mode
      </label>
      <label>
        <input id="journal-opt-in" type="checkbox" disabled>
        Keep a learning journal
      </label>
      <p>
        Saves your questions and attempts on this device only, so you can
        export them later. Off by default.
        <span id="journal-count">0 entries</span>
        <button id="clear-journal" type="button">Clear journal</button>
      </p>
      <p><button id="open-journal" type="button">Open Learning Journal (export)</button></p>
      <p><button id="open-dashboard" type="button">Open Analytics Dashboard</button></p>
      <button id="open-map" type="button">Open Prompt Breakdown Map</button>

      <p id="status" role="status">Loading settings...</p>

      <p>
        This setting is saved on this device. When on, a study panel appears
        above ChatGPT's message box.
      </p>
    </main>
    <script src="journal.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
