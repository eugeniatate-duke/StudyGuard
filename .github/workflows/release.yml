# When you push a tag like v1.1.0, build the extension zip and publish a
# GitHub Release with it attached, so non-developers can download a ready zip.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build zip
        run: python scripts/package.py
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" dist/*.zip --title "StudyGuard ${TAG}" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/*.zip --title "StudyGuard ${TAG}" --generate-notes
          fi
